name: Publish Blueprint v2 foundation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated foundation patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/foundation.patch.gz.b64 <<'PATCH'

PATCH
          base64 -d /tmp/foundation.patch.gz.b64 | gunzip > /tmp/foundation.patch
          git apply --check /tmp/foundation.patch
          git apply /tmp/foundation.patch
          rm .github/workflows/publish-blueprint-v2-foundation.yml
          git config user.name paulohspred
          git config user.email 100045106+paulohspred@users.noreply.github.com
          git add -A
          git commit -m "Start Blueprint v2 platform foundation"
          git push origin HEAD:main
