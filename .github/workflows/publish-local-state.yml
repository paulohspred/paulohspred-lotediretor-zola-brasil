name: Publish validated LoteDiretor state

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-local-state.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated VM patch and publish
        shell: bash
        run: |
          cat > /tmp/lotediretor_patch.b64 <<'PATCH64'

PATCH64
          base64 -d /tmp/lotediretor_patch.b64 | gzip -d > /tmp/lotediretor.patch
          git apply --check /tmp/lotediretor.patch
          git apply /tmp/lotediretor.patch
          rm .github/workflows/publish-local-state.yml
          git config user.name "paulohspred"
          git config user.email "100045106+paulohspred@users.noreply.github.com"
          git add -A
          git commit -m "Activate Sao Paulo ZoLa features and map layers"
          git push origin HEAD:main
