name: Publish validated LoteDiretor state v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-state-v2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated patch
        shell: bash
        run: |
          cat .github/publish/patch.part1 .github/publish/patch.part2 .github/publish/patch.part3 .github/publish/patch.part4 > /tmp/patch.b64
          test "$(wc -c < /tmp/patch.b64)" -eq 40820
          echo "0b5a93b9fdb12757bfcf838932b586a805bc733e9a1e5dff0390c8d4b339e6cb  /tmp/patch.b64" | sha256sum -c -
          base64 -d /tmp/patch.b64 | gzip -d > /tmp/lotediretor.patch
          git apply --check /tmp/lotediretor.patch
          git apply /tmp/lotediretor.patch

      - name: Remove temporary publication files
        shell: bash
        run: |
          rm -rf .github/publish
          rm -f .github/workflows/publish-local-state.yml
          rm -f .github/workflows/publish-state-v2.yml

      - name: Commit validated state
        shell: bash
        run: |
          git config user.name "paulohspred"
          git config user.email "100045106+paulohspred@users.noreply.github.com"
          git add -A
          git commit -m "Activate Sao Paulo ZoLa features and map layers"
          git push origin HEAD:main
