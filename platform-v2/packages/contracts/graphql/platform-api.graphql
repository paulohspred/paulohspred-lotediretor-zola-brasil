type EvidenceCitation {
  documentTitle: String
  id: ID!
  quotedText: String
  sourceLocator: String
  sourceUrl: String
}

type EvidenceProvenanceLink {
  id: ID!
  parentEvidenceId: ID
  relationType: String!
}

type EvidenceQualityAssessment {
  assessedAt: String!
  confidence: Float
  geometryQuality: String
  id: ID!
  notes: String
  sourceQuality: String
  temporalQuality: String
}

type EvidenceRecord {
  calculationMethod: String
  citations: [EvidenceCitation!]!
  evidenceType: String!
  id: ID!
  locator: String
  parserVersion: String
  provenance: [EvidenceProvenanceLink!]!
  qualityAssessment: EvidenceQualityAssessment
  recordedAt: String!
  snapshot: EvidenceSnapshot!
  status: EvidenceStatus!
  statusLabel: String!
  subjectId: String
  subjectType: String
  unit: String
  validFrom: String
  validTo: String
  valueText: String
}

type EvidenceSnapshot {
  authority: String!
  datasetCode: String!
  id: ID!
  ingestedAt: String!
  objectKey: String!
  parserVersion: String
  sha256: String!
  sourceCode: String!
  sourcePublishedAt: String
}

enum EvidenceStatus {
  CALCULADO
  CONFIRMADO
  CONFLITANTE
  INFERIDO
  NAO_DISPONIVEL
  PENDENTE
}

type Query {
  evidence(evidenceType: String, limit: Int, locator: String, municipalityIbge: String, sourceCode: String, status: EvidenceStatus, subjectId: String, subjectType: String): [EvidenceRecord!]!
  evidenceById(id: String!): EvidenceRecord
  source(municipalityIbge: String, sourceCode: String!): SourceRegistryEntry
  sourceSnapshot(id: String!): SourceSnapshotRecord
  sourceSnapshots(limit: Int, municipalityIbge: String, sha256: String, sourceCode: String): [SourceSnapshotRecord!]!
  sources(municipalityIbge: String): [SourceRegistryEntry!]!
}

type SourceEndpoint {
  method: String!
  type: String!
  url: String!
}

type SourceRegistryEntry {
  accessClass: String!
  authority: String!
  cadence: String
  datasetCode: String!
  endpoints: [SourceEndpoint!]!
  id: ID!
  ingestionStatus: String!
  lastCheckedAt: String
  municipalityIbge: String
  municipalityName: String
  parserVersion: String
  sourceCode: String!
  sourceType: String!
}

type SourceSnapshotRecord {
  accessClass: String!
  authority: String!
  byteSize: String
  datasetCode: String!
  featureCount: String
  id: ID!
  ingestedAt: String!
  mediaType: String
  municipalityIbge: String
  municipalityName: String
  objectKey: String!
  parserVersion: String
  schemaFingerprint: String
  sha256: String!
  sourceCode: String!
  sourcePublishedAt: String
  sourceRegistryId: ID!
}
